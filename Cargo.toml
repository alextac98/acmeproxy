[package]
name = "acmeproxy"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "A self-hosted DNS-01 challenge gateway"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
fs2 = "0.4"
nix = { version = "0.30", features = ["signal", "process"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
tempfile = "3"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring"] }
hickory-resolver = "0.25"
x509-parser = { version = "0.18", features = ["verify"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
ring = "0.17"
ipnet = "2"
url = "2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
http-body-util = "0.1"
rcgen = { version = "0.14", features = ["x509-parser"] }
time = "0.3"
