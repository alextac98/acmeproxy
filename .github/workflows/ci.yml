name: Checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install test tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install -r scripts/requirements-release.txt 'certbot==5.8.0'
          echo "$RUNNER_TEMP/release-venv/bin" >> "$GITHUB_PATH"
      - run: python3 -m unittest discover -s tests/release -v
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Verify real Certbot HTTP-01 issuance, renewal, and unsupported requests
        run: ACMEPROXY_CERTBOT=certbot cargo test --locked real_certbot_issues_and_renews -- --ignored
      - run: sh scripts/install-dnsapi.sh
      - run: cargo test --locked --test dnsapi -- --ignored
      - run: cargo build --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: acmeproxy:ci
          cache-from: type=gha,scope=ci-container
          cache-to: type=gha,scope=ci-container,mode=max
      - run: python3 scripts/smoke-compose.py --image acmeproxy:ci
      - name: Verify production HTTP-01 worker on port 80
        run: |
          python3 -m venv "$RUNNER_TEMP/http01-venv"
          "$RUNNER_TEMP/http01-venv/bin/python" -m pip install cryptography
          "$RUNNER_TEMP/http01-venv/bin/python" scripts/smoke-http01.py --image acmeproxy:ci
