# Docker Compose v2.22+. No host Rust or Node installation is needed.
services:
  acmeproxy:
    build:
      context: .
      args:
        BUILD_PROFILE: dev
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    entrypoint: ["/bin/sh", "/usr/local/bin/acmeproxy-dev-entrypoint"]
    ports:
      # 8081 leaves the standalone development server on 8080 available.
      - "0.0.0.0:${DEV_PORT:-8081}:8080"
    volumes:
      - ./dev-data:/config
    tmpfs:
      - "/config/scratch:rw,noexec,nosuid,nodev,size=64m,uid=${DEV_UID:-1000},gid=${DEV_GID:-1000},mode=0700"
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    develop:
      watch:
        # The Rust binary embeds web assets and migrations, so all require rebuilds.
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./web
        - action: rebuild
          path: ./migrations
        - action: rebuild
          path: ./Cargo.toml
        - action: rebuild
          path: ./Cargo.lock
        - action: rebuild
          path: ./docs/providers.json
        - action: rebuild
          path: ./scripts
        - action: rebuild
          path: ./examples/container.toml
        - action: rebuild
          path: ./Dockerfile
