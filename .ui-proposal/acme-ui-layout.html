<script>

    const c=certs.find(c=>c.id===selected);
    const list=certs.map(row=>`<button type="button" class="ap-domain-row cursor-interaction" data-domain-select="${row.id}" aria-pressed="${row.id===selected}"><span>${esc(row.name)}</span>${badge(row.status,row.tone)}<small>${row.id==='apps'?'Wildcard certificate · Traefik':row.id==='home'?'Managed certificate · Home Assistant':'Managed certificate'}</small></button>`).join('');
    return heading('Domains', 'Inspect certificate status, DNS coverage, and client access together.', button('Get a certificate','domain-choose','ap-primary')) +
      `<div class="ap-domain-grid">${panel('Domain inventory',list)}${panel(esc(names[selected]),`<div class="ap-panel-body"><section class="ap-domain-section"><h3>Managed certificate</h3><p>${esc(c.extra)} · expires ${c.expires}</p><div class="ap-actions">${badge(c.status,c.tone)}${button('Certificate details','domain-cert','ap-link')}</div>${selected==='apps'?'<p>Renewal failed: DNS provider credentials rejected. Current certificate still valid.</p>':''}</section><section class="ap-domain-section"><h3>DNS coverage</h3><p>example.com → Cloudflare production</p><div class="ap-actions">${button('Edit DNS connection','domain-provider','ap-link')}</div></section><section class="ap-domain-section"><h3>${selected === 'apps' ? 'Gateway access for descendants' : 'Gateway access'}</h3><p>${selected==='apps'?'Traefik · *.apps.example.com':selected==='home'?'Home Assistant · home.example.com':'No gateway client authorized'}</p><p>Client-managed certificates are not inventoried by the DNS gateway.</p><div class="ap-actions">${button('Manage clients','domain-gateway','ap-link')}</div></section><section class="ap-domain-section"><h3>Validation activity</h3><p>${selected==='apps'?'TXT publishing failed · 12 minutes ago':'TXT cleanup completed · 2 hours ago'}</p><div class="ap-actions">${button('View activity','domain-activity','ap-link')}</div></section></div>`)}</div>`;
  }
  function renderDomain() {
    const app=apps[1], main=app.querySelector('[data-domain-main]');
    const page=state.domainPage;
    if(page==='domains')main.innerHTML=domainDetails();
    else if(page==='certificate') {
      const c=certs.find(c=>c.id===state.selectedDomain);
      main.innerHTML=back('Domains','domain-back')+heading(esc(c.name),'Managed certificate',badge(c.status,c.tone))+panel('Certificate & renewal',`<div class="ap-panel-body">${details([['Valid until',`${c.expires} · ${c.left}`],['Renewal',c.renewal],['DNS provider','Cloudflare production']])}<div class="ap-actions" style="margin-top:20px">${button('Review DNS connection','domain-provider','ap-primary')}${button('View activity','domain-activity')}</div></div>`);
    } else if(page==='choose') {
      main.innerHTML=back('Domains','domain-back')+heading('Choose a certificate method','Three methods sharing the same DNS connections. Use one or several.')+panel('Certificate methods',`<div class="ap-list-row"><div><h3>Managed certificates</h3><p>ACME Proxy obtains the certificate, stores the key, and renews it.</p></div>${button('Request','domain-request','ap-link')}</div><div class="ap-list-row"><div><h3>ACME endpoint</h3><p>Client requests from ACME Proxy after HTTP-01 verification. Client keeps key and renewal.</p></div>${button('Connect','domain-acme','ap-link')}</div><div class="ap-list-row"><div><h3>DNS gateway</h3><p>Client obtains the certificate directly from its authority. ACME Proxy publishes DNS-01 records.</p></div>${button('Connect','domain-gateway','ap-link')}</div>`);
    } else {
      const content={
        managed:()=>heading('Managed certificates','Certificates issued and renewed by this server.')+panel('Managed certificates',certs.map(c=>`<div class="ap-list-row"><div><h3>${esc(c.name)}</h3><p>${c.expires} · ${c.left}</p></div><div class="ap-actions">${badge(c.status,c.tone)}${button('View certificate',`domain-cert:${c.id}`,'ap-link')}</div></div>`).join('')),
        gateway:()=>heading('DNS gateway','Domain-scoped access for your certificate tools.')+panel('Gateway clients',`<div class="ap-list-row"><div><h3>Home Assistant</h3><p>home.example.com · client ID and token</p></div>${badge('Active','good')}</div><div class="ap-list-row"><div><h3>Traefik</h3><p>*.apps.example.com · client ID and token</p></div>${badge('Active','good')}</div>`)+button('View DNS validations →','domain-activity','ap-link'),
        acme:()=>heading('ACME endpoint','Connect your client through the directory URL.')+panel('Client connection',`<div class="ap-panel-body">${badge('Enabled','good')}<code class="ap-code">https://acme.example.com/acme/directory</code><p class="ap-muted ap-small">Your hostname must answer HTTP-01 on port 80. Accounts register automatically; no gateway token needed.</p></div>`)+panel('Registered ACME accounts',`<div class="ap-list-row"><div><h3>ops@example.com</h3><p>HTTP-01 required for every hostname</p></div>${badge('Active','good')}</div>`),
        providers:()=>heading('DNS providers','Domain coverage and saved credentials.')+panel('Cloudflare production',`<div class="ap-panel-body">${details([['DNS zone','example.com'],['Provider','Cloudflare'],['Credentials','Encrypted · saved values hidden']])}<p class="ap-muted ap-small" style="margin-top:18px">Edit this shared connection to resolve DNS authentication errors for all covered domains.</p></div>`),
        activity:()=>heading('Activity','Events and validations across your domains.')+panel('Recent events',recentEvents()),
        settings:()=>heading('Settings','Instance preferences and service configuration.')+panel('Activity retention',`<div class="ap-panel-body"><p>Keep the newest 1,000 events.</p><p class="ap-muted ap-small" style="margin-top:10px">Service options remain in config.toml. Connection settings live with the ACME endpoint and DNS gateway.</p></div>`),
        request:()=>back('Domains','domain-back')+heading('Request a managed certificate','Select domains covered by your DNS connections.')+panel('Domains',`<div class="ap-panel-body"><p>example.com · *.example.com</p><p class="ap-muted ap-small" style="margin-top:10px">ACME Proxy stores the private key and renews automatically. Install renewed files on your services.</p>${button('Preview request','domain-demo','ap-primary')}</div>`)
      };
      main.innerHTML=(content[page]||domainDetails)();
    }
    const method = methodForPage(page);
    if (method) describeMethod(main, method, page);
    for (const b of app.querySelectorAll('[data-domain-go]')) { if(b.dataset.domainGo===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current'); }
  }
  root.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b || b.disabled)return;
    const app=b.closest('[data-app]'); if(!app)return;
    app.querySelector('[data-message]').hidden=true;
    if(b.dataset.domainGo){state.domainPage=b.dataset.domainGo;render();save();return;}
    if(b.dataset.domainSelect){state.selectedDomain=b.dataset.domainSelect;render();save();return;}
    if(b.dataset.go){state.page=b.dataset.go;render();save();return;}
    const a=b.dataset.action;if(!a)return;
    if(a.startsWith('domain-')) {
      if (a.startsWith('domain-cert:')) { state.selectedDomain=a.slice(12);state.domainPage='certificate';render();save();return; }
      const routes={'domain-back':'domains','domain-cert':'certificate','domain-provider':'providers','domain-gateway':'gateway','domain-acme':'acme','domain-activity':'activity','domain-choose':'choose','domain-request':'request'};
      if(routes[a]){state.domainPage=routes[a];render();save();}else message('This is a layout preview using sample data.',app);
      return;
    }
    if(a.startsWith('go:'))state.page=a.slice(3);
    else if(a.startsWith('cert:')){state.selectedCert=a.slice(5);state.page='detail';}
    else if(a.startsWith('client:')){state.selectedClient=a.slice(7);state.page='client-detail';}
    else if(a.startsWith('integration:')){state.page=a.slice(12)==='acme'?'acme':'gateway';}
    else if(a.startsWith('activity:')){state.activity=a.slice(9);state.page='activity';}
    else if(a==='retry'){state.retrying=true;render();message('Preview: renewal would be queued using the current DNS credentials.');save();return;}
    else if(a==='refresh'){message('Preview: showing the latest sample events.');return;}
    else if(['pause','remove-certificate','revoke','demo-download'].includes(a)){message('Preview only. This action would open the relevant file download or confirmation.');return;}
    else if(pages[a])state.page=a;
    render();save();
  });
  root.addEventListener('submit', e=>{
    const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();
    const fields=new FormData(form);
    if(form.dataset.form==='certificate'){state.addedCertificate=String(fields.get('domains')||'example.com').split(/\n/)[0];state.page='certificates';render();message('Preview: certificate request queued. No certificate was actually requested.');}
    else if(form.dataset.form==='provider'){const p={name:String(fields.get('name')||'Cloudflare production'),zone:String(fields.get('zone')||'example.com'),driver:'Cloudflare'};if(state.page==='provider-edit')state.providers[0]=p;else state.providers.push(p);state.page='providers';render();message('Preview: DNS connection saved in sample data.');}
    else if(form.dataset.form==='client'){state.newClient=true;state.newClientName=form.querySelector('#ap-client-name').value;state.newClientScopes=form.querySelector('#ap-client-domains').value;state.selectedClient='new';state.page='client-ready';render();}
    else if(form.dataset.form==='endpoint'){state.page='acme';render();message('Preview: endpoint settings saved in sample data.');}
    else if(form.dataset.form==='settings'){message('Preview: preferences saved in sample data.');}
    save();
  });
  root.addEventListener('input',e=>{
    if(!e.target.matches('[data-event-search]'))return;
    const query=e.target.value.toLowerCase();
    for(const event of apps[0].querySelectorAll('[data-event-list] .ap-event'))event.hidden=!event.textContent.toLowerCase().includes(query);
  });
  function applyScenario() {
    state.providers=design.scenario==='First setup'?[]:[{name:'Cloudflare production',zone:'example.com',driver:'Cloudflare'}];
    state.page='overview';state.newClient=false;state.addedCertificate='';render();save();
  }
  if(saved.design){if(['Configured instance','First setup'].includes(saved.design.scenario))design.scenario=saved.design.scenario;if(Number.isFinite(saved.design.rowSpacing))design.rowSpacing=Math.min(22,Math.max(10,saved.design.rowSpacing));if(design.scenario==='First setup')state.providers=[];}
  render();
  window.addEventListener('openai:set_globals',event=>{
    const next=event.detail?.globals?.widgetState?.privateContent;if(!next)return;
    if(pages[next.page])state.page=next.page;
    if(['gateway','acme'].includes(next.integration))state.integration=next.integration;
    if(['events','validations','orders'].includes(next.activity))state.activity=next.activity;
    if(['apps','home','api'].includes(next.selectedDomain))state.selectedDomain=next.selectedDomain;
    render();
  });
  if(globalThis.Tweak){
    let appliedScenario=design.scenario;
    const tweak=new Tweak({container:apps[0],onChange:()=>{if(appliedScenario!==design.scenario){appliedScenario=design.scenario;applyScenario();}else{render();save();}}});
    tweak.addSelect(design,'scenario',{label:'Instance state',options:['Configured instance','First setup']});
    tweak.addSlider(design,'rowSpacing',{label:'List spacing',min:10,max:22,step:1,unit:'px'});
  }
})();
</script>
